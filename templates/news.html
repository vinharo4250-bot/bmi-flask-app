<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>신재생에너지 기사 검색</title>
    <style>
        body {
            font-family: "Malgun Gothic", sans-serif;
            max-width: 680px;
            margin: 60px auto;
            padding: 20px;
            background: #f5f6fa;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { font-size: 22px; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #4a69bd;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #3c58a8; }
        .error {
            margin-top: 20px;
            padding: 15px;
            background: #ffe9e9;
            color: #c0392b;
            border-radius: 8px;
        }
        .meta {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
        ul.results {
            list-style: none;
            padding: 0;
            margin-top: 12px;
        }
        ul.results li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        ul.results a {
            color: #222;
            text-decoration: none;
            font-size: 14px;
        }
        ul.results a:hover { color: #4a69bd; text-decoration: underline; }
        .press-date {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>신재생에너지 기사 검색</h1>
        <p><a href="/">← 카페 반응 모니터링</a></p>
        <form method="POST">
            <label for="keyword">검색어</label>
            <input type="text" id="keyword" name="keyword" required
                   value="{{ keyword or '' }}" placeholder="예: 태양광, 풍력, ESS">

            <div class="row">
                <div>
                    <label for="days">최근 N일</label>
                    <input type="number" id="days" name="days" min="1" max="90"
                           value="{{ days or 7 }}">
                </div>
            </div>

            <button type="submit">검색</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if searched %}
        <div class="meta">
            "{{ keyword }}" 검색어로 최근 {{ days }}일간 기사 {{ results|length }}건
        </div>

        {% if results %}
        <ul class="results">
            {% for r in results %}
            <li>
                <a href="{{ r.url }}" target="_blank" rel="noopener">{{ r.title }}</a>
                <div class="press-date">{{ r.press }} · {{ r.date }}</div>
            </li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endif %}
    </div>
</body>
</html>
